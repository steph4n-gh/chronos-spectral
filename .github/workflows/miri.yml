name: CHRONOS-SPECTRAL Miri

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Sharded Stacked-Borrows Miri checks on the scalar backend.
# Kept in its own workflow (separate from ci.yml) so its ~1-2h audit shard never delays
# pages.yml, which triggers on `workflow_run: completed` of "CHRONOS-SPECTRAL CI".

jobs:
  miri-scalar:
    name: Miri (non-blocking, ${{ matrix.slice }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Non-blocking while the findings in docs/VERIFICATION_AND_BENCHMARKS.md ("Miri") are open.
    # Sharded in parallel so each Miri suite finishes well within its timeout instead of
    # serializing ~150+ minutes in one runner.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: simd-layer
            cmd: cargo "+$MIRI_TOOLCHAIN" miri test --target "$HOST" --features simd-force-scalar
          - slice: kernel-ticks
            cmd: cargo "+$MIRI_TOOLCHAIN" miri test --manifest-path native/Cargo.toml --target "$HOST" --features simd-force-scalar --test kernel_ticks -- --nocapture
          - slice: depth-abi
            cmd: cargo "+$MIRI_TOOLCHAIN" miri test --manifest-path native/Cargo.toml --target "$HOST" --features simd-force-scalar --test miri_depth miri_depth_abi_smoke -- --nocapture
          - slice: wind-tunnel
            cmd: cargo "+$MIRI_TOOLCHAIN" miri test --manifest-path native/Cargo.toml --target "$HOST" --features simd-force-scalar --test miri_wind_tunnel -- --nocapture
          - slice: elastography
            cmd: cargo "+$MIRI_TOOLCHAIN" miri test --manifest-path native/Cargo.toml --target "$HOST" --features simd-force-scalar --test miri_elastography -- --nocapture
          - slice: audit
            cmd: cargo "+$MIRI_TOOLCHAIN" miri test --manifest-path native/Cargo.toml --target "$HOST" --features simd-force-scalar --test miri_audit -- --nocapture
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MIRI_TOOLCHAIN: nightly-2026-10-19
      # Stacked Borrows (Miri's default aliasing model, the stricter of the two). Nothing else.
      MIRIFLAGS: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the pinned nightly with Miri (Miri only; everything else uses rust-toolchain.toml)
        run: |
          rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src --no-self-update
          cargo "+$MIRI_TOOLCHAIN" miri --version
          cargo "+$MIRI_TOOLCHAIN" miri setup

      - name: Run Miri (${{ matrix.slice }})
        run: |
          HOST="$(rustc "+$MIRI_TOOLCHAIN" -vV | sed -n 's/^host: //p')"
          ${{ matrix.cmd }}
