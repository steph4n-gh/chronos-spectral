name: CHRONOS-SPECTRAL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-wasm-simd128-and-e2e:
    name: Build Wasm32 SIMD128, Math Audit, MP4 Calibration & Chrome E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Shared cloud VM headroom while keeping strict 1.0x (<0.35ms SD / <1.00ms HD / <2.00ms C1K Swarm) on bare-metal local runs
      CHRONOS_CI_BUDGET_SCALE: "3.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install wabt (wasm-objdump) and ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends wabt ffmpeg

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          PINNED="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$PINNED" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustc --version

      - name: Cache Cargo registry and target build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm32-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32-

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure Google Chrome Stable (branded build with H.264 MP4 codec)
        run: |
          if [ ! -x /opt/google/chrome/chrome ]; then
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/google-chrome.deb
            sudo apt-get install -y --no-install-recommends /tmp/google-chrome.deb
            rm -f /tmp/google-chrome.deb
          fi
          /opt/google/chrome/chrome --version

      - name: Run full build, static Wasm audit, math gates, MP4 calibration, and Chrome CDP E2E
        env:
          CHROME_BIN: /opt/google/chrome/chrome
          CI: "1"
          CHRONOS_VERIFY_COMMITTED_WASM: "1"
        run: ./build.sh --e2e
