[package]
name = "chronos_spectral"
version = "2.0.0"
edition = "2021"
authors = ["steph4n-gh"]
description = "Zero-ML, zero-allocation #![no_std] Wasm32 SIMD128 spatiotemporal wavefield, 1,500-target swarm & continuum physics tracker"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/steph4n-gh/chronos-spectral"
keywords = ["computer-vision", "tracking", "wasm", "simd128", "no-std"]
categories = ["computer-vision", "science", "wasm", "no-std", "multimedia::video"]

[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
