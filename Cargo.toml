[package]
name = "chronos_spectral"
version = "3.5.0"
edition = "2021"
authors = ["steph4n-gh"]
description = "Zero-ML, zero-allocation #![no_std] Wasm32 SIMD128 visual physics kernel: 3,072-target swarm, BOS Schlieren, Hodge, vibrometry, depth, wind tunnel & elastography"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/steph4n-gh/chronos-spectral"
keywords = ["computer-vision", "tracking", "wasm", "simd128", "no-std"]
categories = ["computer-vision", "science", "wasm", "no-std", "multimedia::video"]

[lib]
crate-type = ["cdylib"]

[dependencies]

# Every feature is off by default: the shipped Wasm (`cargo build --release`) is built with none.
[features]
# Native builds only: use the portable scalar reference backend (`src/simd/scalar.rs`) even
# where an arch-specific backend exists. It is the conformance oracle and the Miri target.
simd-force-scalar = []
# Adds the `chronos_simd_conformance_*` exports that run the SIMD conformance suite in-module,
# comparing `core::arch::wasm32` against `simd::scalar`. Built by `scripts/gate_simd_conformance.mjs`
# into its own target directory; never enabled for `web/chronos_spectral.wasm`.
simd-conformance = []
# Set by `native/Cargo.toml`, which compiles this same source as a native `rlib` for Rust
# consumers (integration tests, host binaries). Such a build links into a `std` binary, so the
# crate's own `#[panic_handler]` is omitted.
native-lib = []
# Native-only 1280x720 (720p) engine mode (res_mode=2, scale_px=4). Ignored on wasm32.
hires-720p = []

# A native `no_std` cdylib cannot unwind (wasm32 aborts by default). Cargo ignores `panic` for
# test targets, so `cargo test --target host-tuple` still uses the unwinding test harness.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
